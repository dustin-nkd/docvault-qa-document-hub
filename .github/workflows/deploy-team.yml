name: Deploy to Firebase Hosting (Team Edition)

on:
  push:
    branches:
      - main

jobs:
  deploy-team:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run production quality gate
        run: npm run check

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Build production artifact
        run: npm run build:pages

      - name: Build team artifact
        run: npm run build:team

      - name: Deploy to Firebase Hosting and Firestore rules
        run: npx firebase-tools deploy --only hosting,firestore:rules --project docvault-qa-team --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
